name: Release APK

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Run Unit Tests
        run: gradle test

      - name: Increment Version
        id: version
        run: |
          NEW_CODE=${{ github.run_number }}
          NEW_NAME="1.${{ github.run_number }}"
          
          echo "VERSION_CODE=$NEW_CODE" > version.properties
          echo "VERSION_NAME=$NEW_NAME" >> version.properties
          
          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHEETS_SYNC_SECRET: ${{ secrets.SHEETS_SYNC_SECRET }}
        run: gradle assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: 9B Exam Marks Hub v${{ steps.version.outputs.version_name }}
          body: |
            📱 **9B Exam Marks Hub v${{ steps.version.outputs.version_name }}**
            
            **How to install:**
            1. Download the APK file below
            2. Open it on your Android phone
            3. If asked, allow "Install from unknown sources"
            4. Install and enjoy!
          files: app/build/outputs/apk/release/*.apk
